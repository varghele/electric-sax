# Raspberry Pi 5 bootloader EEPROM settings for the EMEO bell.
# Apply with:  sudo -E rpi-eeprom-config --edit   (paste the three lines under [all], save, reboot)

[all]
# Powered through the 5 V GPIO pins from a Pololu D36V50F5 (5.5 A) - no USB-PD negotiation.
# Tells the Pi the supply can do 5 A, so USB ports aren't limited to 600 mA.
PSU_MAX_CURRENT=5000
# Cut the 5 V rail fully when halted (~0.01 W instead of ~1 W) - the pack doesn't drain while
# the Pi sits switched off at a gig.
POWER_OFF_ON_HALT=1
WAKE_ON_GPIO=0
